# Server
server.port=8080

# Datasource — env-var driven so Pivota's sandbox-sidecar pattern (Postgres
# sibling container) can override the in-memory default at runtime without
# code changes. Outside Pivota (plain `mvnw spring-boot:run`) the H2 fallback
# preserves the original zero-setup dev experience.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:srtdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Driver class is auto-detected from the URL — leaving it implicit lets Spring
# pick H2 vs Postgres based on which jdbc: prefix is in play.

# JPA / Hibernate — `update` so the schema is created on first boot against
# Postgres (which keeps data across restarts) and is no-op on subsequent
# boots; H2 in-memory recreates each run so the effect is the same there.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (development only) — harmless if the datasource is Postgres.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson — serialize dates as ISO 8601 strings
spring.jackson.serialization.write-dates-as-timestamps=false

# Error handling — no stack traces in responses
server.error.include-stacktrace=never
